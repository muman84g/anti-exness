services:
  # ── Bot 8 (S8用設定) ──────────────────────────────────────
  exness-bot-8:
    build:
      context: .
      dockerfile: Dockerfile
    image: exness-bot:latest
    container_name: exness-bot-8
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ./bot8/s8_bot_state.json:/app/bot8/s8_bot_state.json
